# build-patcher.yml
# Fixed: builds worker DLL + GUI EXE artifact

      - name: Verify WerbungFix v2 markers
        shell: pwsh
        run: |
          $dll = "$env:GITHUB_WORKSPACE\x64\Release\dxgi.dll"
          $bytes = [System.IO.File]::ReadAllBytes($dll)
          $ascii = [System.Text.Encoding]::ASCII.GetString($bytes)
          $unicode = [System.Text.Encoding]::Unicode.GetString($bytes)

          foreach ($marker in @(
            "hideWerbungInRoot",
            "ZInq9.X5H9F.JPJ5T",
            "__NewOutlookPatcherNOABWerbungTimer",
            "Werbung"
          )) {
            if (-not ($ascii.Contains($marker) -or $unicode.Contains($marker))) {
              throw "WerbungFix v2 marker missing in dxgi.dll: $marker"
            }
          }

          Write-Host "WerbungFix v2 markers found in dxgi.dll."

      - name: Build GUI
        shell: pwsh
        run: |
          $root = "$env:GITHUB_WORKSPACE"

          dotnet publish "$root\NOP\gui\gui.csproj" `
            -c Release `
            -r win-x64 `
            --self-contained false `
            "-p:SolutionDir=$root\"

          if ($LASTEXITCODE -ne 0) {
            throw "GUI publish failed."
          }

      - name: Prepare final patcher artifact
        shell: pwsh
        run: |
          $root = "$env:GITHUB_WORKSPACE"
          $dist = "$root\dist"

          New-Item -ItemType Directory -Path $dist -Force | Out-Null

          Copy-Item `
            "$root\NOP\gui\bin\Release\net8.0-windows\win-x64\publish\NewOutlookPatcher.exe" `
            "$dist\NewOutlookPatcher.exe"

          Copy-Item `
            "$root\x64\Release\dxgi.dll" `
            "$dist\dxgi.dll"

          Get-FileHash "$dist\dxgi.dll" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  dxgi.dll" } |
            Set-Content "$dist\SHA256SUMS.txt"

          Get-ChildItem $dist

      - name: Upload final patcher
        uses: actions/upload-artifact@v4
        with:
          name: NOAB-WerbungFix-v2
          if-no-files-found: error
          path: dist
