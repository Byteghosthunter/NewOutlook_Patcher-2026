name: Build NewOutlookPatcher NOAB v1.1 Integrated

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v1.1*"

permissions:
  contents: read

jobs:
  build-x64:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Guard known-working native worker
        shell: pwsh
        run: |
          $worker = "$env:GITHUB_WORKSPACE\NOP\worker\dllmain.cpp"

          # Normalize line endings and BOM before hashing. A raw byte hash is
          # brittle on Windows because Git may check text files out as CRLF.
          $text = [System.IO.File]::ReadAllText($worker)
          $text = $text.Replace("`r`n", "`n").Replace("`r", "`n")
          $bytes = [System.Text.UTF8Encoding]::new($false).GetBytes($text)
          $sha = [System.Security.Cryptography.SHA256]::Create()
          $actual = [BitConverter]::ToString($sha.ComputeHash($bytes)).Replace("-", "")
          $expected = "23F00ACAD0E81ACCC8FC72F4516CF33487C874D8EF1D78592B91FF57849EE02A"

          Write-Host "Expected normalized worker SHA256: $expected"
          Write-Host "Actual normalized worker SHA256:   $actual"

          if ($actual -ne $expected) {
            throw "The known-working Outlook 1.2026.915.300 worker source changed."
          }

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore packages
        shell: pwsh
        run: |
          nuget restore "$env:GITHUB_WORKSPACE\NOP.sln"
          if ($LASTEXITCODE -ne 0) { throw "NuGet restore failed." }

      - name: Build official MinHook 1.3.4 x64 static
        shell: pwsh
        run: |
          $root = "$env:GITHUB_WORKSPACE"
          $src = "$root\_minhook-src"
          $build = "$root\_minhook-build"

          git clone --depth 1 --branch v1.3.4 https://github.com/TsudaKageyu/minhook.git $src
          if ($LASTEXITCODE -ne 0) { throw "MinHook clone failed." }

          cmake -S $src -B $build -A x64 -DBUILD_SHARED_LIBS=OFF
          if ($LASTEXITCODE -ne 0) { throw "MinHook configure failed." }

          cmake --build $build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw "MinHook build failed." }

          $lib = Get-ChildItem $build -Recurse -File |
            Where-Object { $_.Name -ieq "minhook.x64.lib" -or $_.Name -ieq "libMinHook.x64.lib" } |
            Select-Object -First 1

          if (-not $lib) { throw "MinHook x64 static library was not found." }
          if (-not (Test-Path "$src\include\MinHook.h")) { throw "Official MinHook.h was not found." }

          Copy-Item "$src\include\MinHook.h" "$root\NOP\worker\MinHook.h" -Force
          Copy-Item $lib.FullName "$root\NOP\worker\libMinHook.x64.lib" -Force

      - name: Build known-working x64 worker
        shell: pwsh
        run: |
          $root = "$env:GITHUB_WORKSPACE"
          $out = "$root\x64\Release\"
          New-Item -ItemType Directory -Path $out -Force | Out-Null

          msbuild "$root\NOP\worker\worker.vcxproj" `
            /m `
            /p:Configuration=Release `
            /p:Platform=x64 `
            "/p:SolutionDir=$root\" `
            "/p:OutDir=$out"

          if ($LASTEXITCODE -ne 0) { throw "Worker build failed." }
          if (-not (Test-Path "$out\dxgi.dll")) { throw "dxgi.dll was not created." }

      - name: Verify working worker markers
        shell: pwsh
        run: |
          $dll = "$env:GITHUB_WORKSPACE\x64\Release\dxgi.dll"
          $bytes = [System.IO.File]::ReadAllBytes($dll)
          $unicode = [System.Text.Encoding]::Unicode.GetString($bytes)
          $ascii = [System.Text.Encoding]::ASCII.GetString($bytes)

          foreach ($marker in @(
            "MessageAdKeyOutlookUpSell",
            "WebView2 MinHook enabled successfully",
            "CreateCoreWebView2EnvironmentWithOptions intercepted",
            "AddScriptToExecuteOnDocumentCreated",
            "ThunkOldAddress"
          )) {
            if (-not ($unicode.Contains($marker) -or $ascii.Contains($marker))) {
              throw "Built worker is missing marker: $marker"
            }
          }

      - name: Verify HOSTS safety list
        shell: pwsh
        run: |
          $hostsSource = Get-Content "$env:GITHUB_WORKSPACE\NOP\gui\HostsBlocker.cs" -Raw

          foreach ($domain in @(
            "msft-ssp.adnxs.com",
            "msft-ssp-fra1.adnxs.com",
            "eb2.3lift.com",
            "b1t-dubdc2.outbrain.com"
          )) {
            if (-not $hostsSource.Contains($domain)) {
              throw "HOSTS source is missing expected domain: $domain"
            }
          }

          if ($hostsSource.Contains('"outlook.office.com"')) {
            throw "Safety failure: outlook.office.com must never be in the managed HOSTS block."
          }

      - name: Publish GUI after worker build
        shell: pwsh
        run: |
          $root = "$env:GITHUB_WORKSPACE"

          dotnet publish "$root\NOP\gui\gui.csproj" `
            -c Release `
            -r win-x64 `
            --self-contained false `
            "-p:SolutionDir=$root\"

          if ($LASTEXITCODE -ne 0) { throw "GUI publish failed." }

          $exe = "$root\NOP\gui\bin\Release\net8.0-windows\win-x64\publish\NewOutlookPatcher.exe"
          if (-not (Test-Path $exe)) { throw "NewOutlookPatcher.exe was not created." }

      - name: Prepare release artifact
        shell: pwsh
        run: |
          $root = "$env:GITHUB_WORKSPACE"
          $dist = "$root\dist"
          New-Item -ItemType Directory -Path $dist -Force | Out-Null

          Copy-Item `
            "$root\NOP\gui\bin\Release\net8.0-windows\win-x64\publish\NewOutlookPatcher.exe" `
            "$dist\NewOutlookPatcher-NOAB-2026-v1.1.exe"

          Copy-Item "$root\x64\Release\dxgi.dll" "$dist\NewOutlookPatcher.dll"
          Copy-Item "$root\domains.txt" "$dist\domains.txt"
          Copy-Item "$root\Check-NOAB-Install.ps1" "$dist\Check-NOAB-Install.ps1"
          Copy-Item "$root\RELEASE-NOTES-v1.1.md" "$dist\RELEASE-NOTES-v1.1.md"
          Copy-Item "$root\LICENSE" "$dist\LICENSE"
          Copy-Item "$root\THIRD-PARTY-MINHOOK-LICENSE.txt" "$dist\THIRD-PARTY-MINHOOK-LICENSE.txt"

          Get-ChildItem $dist -File | ForEach-Object {
            $hash = Get-FileHash $_.FullName -Algorithm SHA256
            "$($hash.Hash)  $($_.Name)"
          } | Set-Content "$dist\SHA256SUMS.txt"

      - name: Upload v1.1 artifact
        uses: actions/upload-artifact@v4
        with:
          name: NewOutlookPatcher-NOAB-2026-v1.1-x64
          if-no-files-found: error
          path: dist
